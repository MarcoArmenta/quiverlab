[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quiverlab"
version = "0.1.0"
description = "Exact representation theory of quivers with relations, for algebraists: modules and AR theory, resolutions, Ext-algebras, Hochschild and cyclic (co)homology, invariants"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marco Armenta", email = "drmarcoarmenta@gmail.com" }]
keywords = [
    "quiver", "path algebra", "Hochschild cohomology", "Gerstenhaber bracket",
    "representation theory", "homological algebra", "exact arithmetic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21", "sympy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
fast = ["numba>=0.64"]
# [hpc]: the container/CLI tier (Plan 28). YAML config parsing only -- JSON works
# with the stdlib alone, so pyyaml is imported lazily in quiverlab.hpc.spec and is
# NOT a base dependency (the lean base wheel stays float-free and web-free).
hpc = ["pyyaml>=6"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-ulid>=2.7",
    "pydantic>=2.7",
]
# [qpa]: passagemath-gap 10.8.x ships prebuilt GAP + (via its own [qpa] sub-extra)
# QPA v1.37 + GBNP, in manylinux/musllinux + macOS wheels (Python 3.11-3.14). No
# Windows wheel -> the `sys_platform != 'win32'` marker makes the extra installable-
# but-empty on Windows, and quiverlab.qpa prints the loud graceful message at runtime
# (Task 4). VERIFY the exact pin/extra name at execution (research: 10.8.6, 2026-07-16).
qpa = ["passagemath-gap[qpa]>=10.8; sys_platform != 'win32'"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mike>=2.1",
]
dev = ["pytest>=8", "build>=1.2", "twine>=5.1", "httpx>=0.27"]

[project.scripts]
# Plan 28: the HPC/container CLI lives in the wheel; the container is a thin
# wrapper. `pip install quiverlab[hpc]` gives the same CLI with no container.
quiverlab-hpc = "quiverlab.hpc.cli:main"

[project.urls]
Homepage = "https://marcoarmenta.github.io/quiverlab/"
Documentation = "https://marcoarmenta.github.io/quiverlab/"
Repository = "https://github.com/MarcoArmenta/quiverlab"
Issues = "https://github.com/MarcoArmenta/quiverlab/issues"
Changelog = "https://github.com/MarcoArmenta/quiverlab/blob/main/CHANGELOG.md"
# "Web GUI" and the JOSS DOI are added at web-deploy / JOSS-acceptance time.

[tool.setuptools.packages.find]
# Only the library ships in `pip install quiverlab` (lean base wheel). The
# deploy-only `webapp` tier lives at the repo root and is served from the source
# tree by the editable deploy install (webapp/deploy) -- it is NOT packaged into
# the wheel/sdist, which would bloat every `pip install quiverlab` and, without a
# matching package-data block, ship broken in a non-editable install anyway.
where = ["src"]
include = ["quiverlab*"]

# LOAD-BEARING -- do NOT drop. citations/registry.py loads references.bib and
# families/zoo.py loads zoo_catalog.json by __file__-relative path; without this
# block both files are absent from the built wheel/sdist and bibliography()/zoo()
# break in an installed environment (Plan 06). See the sdist/wheel data-file
# packaging check in Task 10 (test_build.py, open item #4).
[tool.setuptools.package-data]
"quiverlab.citations" = ["references.bib"]
"quiverlab.families" = ["zoo_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: quick tests; run on every CI matrix cell (OS x Python)",
    "deep: heavy engine/resolution/Chouhy-Solotar suites; one Linux cell (~19 min)",
    "qpa: requires the [qpa] extra (passagemath-gap + QPA); the CI QPA job only",
    "m2: requires a local Macaulay2 binary; the CI M2 job only. Doubles as the fifth oracle class (external M2 recomputes and agrees).",
    "slow: individually long tests; opt-in via -m slow",
    # --- Oracle-class markers (Plan 32) -------------------------------------
    # ORTHOGONAL to the fast/deep/qpa runtime buckets above: they classify HOW
    # a test verifies, not where it runs. A test may carry more than one (a
    # battery pins a literature value AND asserts cross-engine agreement). The
    # QPA oracle class is the existing `qpa` marker -- no new marker for it.
    # Unmarked = contract & infrastructure. See docs/verification.md and
    # docs/plans/2026-07-26-plan-32-oracle-markers.md.
    "oracle_literature: pass criterion is a value/identity from the literature or classical theory (paper-pinned dims, closed forms, theorem identities, bank closed-forms)",
    "oracle_crossengine: two INDEPENDENT implementations must agree (CS/bar/Bardzell/minimal degreewise, numba/pure parity, presented/-|x iso-invariance, native/transported cup-cap, engine/generic-Domain)",
    "oracle_selfcert: an internal mathematical certificate is the assertion (d-d=0, CS order condition, dimension/iso certificates, byte-reproducibility/canonicality, adversarial-solver determinism, arbitration identities)",
]
