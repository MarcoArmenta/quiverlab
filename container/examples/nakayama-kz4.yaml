# Second worked example: the cyclic Nakayama algebra  kZ_4 / J^3  over GF(7) --
# 4 vertices in a cycle (arrows a1: 1->2, a2: 2->3, a3: 3->4, a4: 4->1), paths of
# length 3 vanish. dim 12, monomial, self-injective, infinite global dimension.
#
# The module block is a NO-CODE explicit representation (dims + one matrix per
# arrow): M = P(1) (+) S(2), dims (1, 2, 1, 0) -- deliberately DECOMPOSABLE so the
# Krull-Schmidt section splits it, and with a projective summand so the AR
# translate drops it (tau kills projectives). Resolutions rotate through the
# vertices, exercising the P_j^n + P_i^m summand notation.
#
# Run it the two ways:
#   docker run --rm -v "$PWD/container/examples:/cfg:ro" -v "$PWD/out/container:/out" \
#       quiverlab:local run /cfg/nakayama-kz4.yaml -o /out/result.json
#   quiverlab-hpc run container/examples/nakayama-kz4.yaml -o out/local/result.json
schema: 2
algebra:
  kind: family
  family: NakayamaAlgebra
  params:
    n: 4
    l: 3
    cyclic: true
  field:
    kind: GF
    p: 7
    n: 1
compute:
  - "hh_cohomology:0..6"
  - "hh_homology:0..6"
  - "cup:0..2"
  - "cap:0..2"
  - "bracket:0..2"
  - "connes_b:0..2"
  - cartan
  - coxeter_polynomial
  - global_dimension
  - center
  - dimension
  - dimension_vector
  - rad_top_soc
  - tau
  - tau_minus
  - "projective_resolution:0..6"
  - "injective_resolution:0..6"
  - projective_dimension
  - injective_dimension
  - decompose
  - "ext:0..6"
  - "tor:0..6"
module:
  side: right
  dims: {"1": 1, "2": 2, "3": 1, "4": 0}
  maps:
    a1: [[1], [0]]        # M_1 -> M_2: e_1 |-> the P(1)-strand basis vector
    a2: [[1, 0]]          # M_2 -> M_3: the strand continues, S(2) dies
ext_target:
  builtin: {kind: simple, vertex: 1, side: right}
tor_target:
  builtin: {kind: simple, vertex: 1, side: left}
artifacts:
  pdf: false
  tikz: true
hpc:
  time_limit_s: 3600
  max_mem_bytes: 4294967296
