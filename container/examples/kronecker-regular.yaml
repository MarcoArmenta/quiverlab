# Sixth worked example -- BIGGER MODULES: the Kronecker quiver (2 vertices,
# arrows a, b: 1 -> 2, no relations; hereditary, dim 4) over GF(32003), with the
# REGULAR representations of a homogeneous tube as computed-on modules:
#   R_lambda(n): dims (n, n), a = identity, b = the n x n Jordan block J_n(lambda).
# Here M = R_2(20) (dim 40) and N = R_2(12) (dim 24) -- interior by the Kronecker
# classification (preprojectives/preinjectives have UNEQUAL dims (k, k+1)), and
# certified indecomposable in the report. The tube facts the report exhibits:
#   tau M is isomorphic to M (regulars are tau-fixed -- dims and matrices agree),
#   dim Hom(R(n), R(m)) = dim Ext^1(R(n), R(m)) = min(n, m) = 12 = Tor_0 = Tor_1,
#   0 -> P_2^20 -> P_1^20 -> M -> 0 (pd = 1, hereditary), differentials shown.
#
# Run it the two ways:
#   docker run --rm -v "$PWD/container/examples:/cfg:ro" -v "$PWD/out/container:/out" \
#       quiverlab:local run /cfg/kronecker-regular.yaml -o /out/result.json
#   quiverlab-hpc run container/examples/kronecker-regular.yaml -o out/local/result.json
schema: 2
algebra:
  kind: quiver
  vertices: [1, 2]
  arrows: {a: [1, 2], b: [1, 2]}
  relations: []
  field: {kind: GF, p: 32003, n: 1}
compute:
  - "hh_cohomology:0..4"
  - "hh_homology:0..4"
  - cartan
