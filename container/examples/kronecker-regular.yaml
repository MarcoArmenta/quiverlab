  - dimension
  - dimension_vector
  - rad_top_soc
  - decompose
  - tau
  - tau_minus
  - "projective_resolution:0..3"
  - "injective_resolution:0..3"
  - projective_dimension
  - injective_dimension
  - "ext:0..3"
  - "tor:0..3"
