# Third worked example, bigger and with INTERIOR modules: the 3x3 commutative
# grid  kA_3 (x) kA_3  over GF(101), given as an explicit quiver -- 9 vertices
# (ij), horizontal arrows hij: (ij)->(i j+1), vertical arrows vij: (ij)->(i+1 j),
# and the four commutativity squares as non-monomial relations. dim 36 (one basis
# path per poset interval), FINITE global dimension (= 2), so this report shows
# finite projective/injective dimensions for a change.
#
# M is the "staircase" interval module on {(1,2),(1,3),(2,1),(2,2),(2,3)} (dim 5,
# thin, identity internal maps) and N is the interval on {(2,1),(2,2),(3,1)} --
# which is exactly tau M, so Ext^1(M, N) = 1 exhibits the Auslander-Reiten class.
# Projectives of an incidence algebra are UP-sets and injectives are DOWN-sets of
# the poset with dim 1; neither support is either (and dims 5, 3 > 1, so not
# simple): genuinely interior indecomposables, certified in the Krull-Schmidt
# section. The Tor target is the same interval as a LEFT module (Tor_1 = 1).
#
# Run it the two ways:
#   docker run --rm -v "$PWD/container/examples:/cfg:ro" -v "$PWD/out/container:/out" \
#       quiverlab:local run /cfg/grid3x3.yaml -o /out/result.json
#   quiverlab-hpc run container/examples/grid3x3.yaml -o out/local/result.json
schema: 2
algebra:
  kind: quiver
  vertices: [11, 12, 13, 21, 22, 23, 31, 32, 33]
  arrows:
    h11: [11, 12]
    h12: [12, 13]
    h21: [21, 22]
    h22: [22, 23]
    h31: [31, 32]
    h32: [32, 33]
    v11: [11, 21]
    v12: [12, 22]
    v13: [13, 23]
    v21: [21, 31]
    v22: [22, 32]
    v23: [23, 33]
  relations:
    - "h11*v12 - v11*h21"
    - "h12*v13 - v12*h22"
    - "h21*v22 - v21*h31"
    - "h22*v23 - v22*h32"
  field:
    kind: GF
    p: 101
    n: 1
compute:
  - "hh_cohomology:0..4"
  - "hh_homology:0..4"
  - cartan
  - coxeter_polynomial
  - global_dimension
  - center
  - dimension
  - dimension_vector
  - rad_top_soc
  - decompose
  - tau
  - tau_minus
  - "projective_resolution:0..4"
  - "injective_resolution:0..4"
  - projective_dimension
  - injective_dimension
  - "ext:0..4"
  - "tor:0..4"
module:
  side: right
  dims: {"12": 1, "13": 1, "21": 1, "22": 1, "23": 1}
  maps:
    h12: [[1]]
    h21: [[1]]
    h22: [[1]]
    v12: [[1]]
    v13: [[1]]
ext_target:
  side: right
  dims: {"21": 1, "22": 1, "31": 1}
  maps:
    h21: [[1]]
    v21: [[1]]
tor_target:
  side: left
  dims: {"21": 1, "22": 1, "31": 1}
  maps:
    h21: [[1]]
    v21: [[1]]
artifacts:
  pdf: false
  tikz: true
hpc:
  time_limit_s: 3600
  max_mem_bytes: 4294967296
