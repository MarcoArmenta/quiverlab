name: Macaulay2 cross-check

on:
  push:
    branches: [main, dev, plan-36-m2-oracle]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # weekly (Mon 06:00 UTC); the M2 apt install is heavy

jobs:
  m2:
    name: Macaulay2 cross-check · linux · py3.12
    runs-on: ubuntu-latest
    env:
      NUMBA_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MPLBACKEND: "Agg"
      QUIVERLAB_REQUIRE_M2: "1"   # absent/broken M2 is a HARD failure in this job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Macaulay2
        run: |
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2
          M2 --version
      - name: Install quiverlab[dev]
        run: |
          python -m pip install --upgrade pip
          # M2 is a system binary (apt above), NOT a pip package -- there is no [m2] extra.
          pip install -e ".[dev]"
      - name: Sanity — M2 is on PATH and answers --version
        run: python -c "from quiverlab.m2 import m2_available; assert m2_available(), 'M2 failed to load'"
      - name: Run the m2 oracle bucket (mandatory)
        env:
          QUIVERLAB_REQUIRE_M2: "1"
          NUMBA_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
        run: python -m pytest -q -m m2
