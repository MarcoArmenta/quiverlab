name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUMBA_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MPLBACKEND: "Agg"                       # headless matplotlib for tutorial execution
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,docs]"     # installs quiverlab (mkdocstrings + notebook exec)
      - run: mkdocs build --strict            # executes tutorials, builds API ref, fails on warnings
        env:
          # Material for MkDocs injects a deprecation warning (2026-07) that
          # aborts --strict on any content; this is the vendor-sanctioned bypass.
          DISABLE_MKDOCS_2_WARNING: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # main only: the github-pages environment's deployment-branch policy allows
    # ONLY main, so a tag ref is rejected at the environment gate (seen live on
    # v0.1.0: deploy failed with zero steps run). Tags still run the strict
    # BUILD above as a release-time docs check; the same commit's branch push
    # already deployed the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
