name: Container

# Build the HPC + offline-GUI image, smoke it INSIDE docker (run + render a tiny
# example), push it to GHCR, and attach a SIF fallback asset to the release.
# Tag-gated (a version tag Marco pushes) + manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-smoke-push:
    name: build · smoke · push GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Registry repository paths are lowercase-only; the repo owner is
      # "MarcoArmenta", so ${{ github.repository_owner }} verbatim makes docker
      # refuse the reference. Lowercase it in bash (expressions cannot).
      - name: Resolve image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quiverlab" >> "$GITHUB_ENV"

      - name: Resolve version (tag without leading v; pyproject on manual dispatch)
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # amd64 is built first and --load'ed so every smoke below runs against the
      # exact image that ships; the multi-arch push at the end reuses its layers
      # through the GHA build cache.
      - name: Build image (amd64, loaded for smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: QUIVERLAB_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image version matches the build version
        run: |
          OUT="$(docker run --rm "$IMAGE:${{ steps.ver.outputs.version }}" version)"
          echo "version verb reported: $OUT"
          echo "$OUT" | grep -F -- "${{ steps.ver.outputs.version }}"

      - name: Smoke -- selftest
        run: docker run --rm "$IMAGE:${{ steps.ver.outputs.version }}" selftest

      - name: Smoke -- run + render a tiny example
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm \
            -v "$PWD/container:/cfg:ro" -v "$PWD/out:/out" \
            "$IMAGE:${{ steps.ver.outputs.version }}" \
            run /cfg/ci-tiny.yaml -o /out/result.json
          test -s out/result.json
          python -c "import json; d=json.load(open('out/result.json')); assert 'result_schema' in d, d; print('result.json keys:', sorted(d))"
          docker run --rm \
            -v "$PWD/out:/out" \
            "$IMAGE:${{ steps.ver.outputs.version }}" \
            render /out/result.json -o /out/report.html --format html
          test -s out/report.html
          # The rendered HTML report carries real content -- no PDF toolchain needed
          # (math is KaTeX/MathML, not tectonic).
          grep -q "quiverlab report" out/report.html
          # Cross-check the plain-text renderer yields real tokens (not a blank page).
          docker run --rm \
            -v "$PWD/out:/out" \
            "$IMAGE:${{ steps.ver.outputs.version }}" \
            render /out/result.json -o /out/report.txt --format txt
          test -n "$(tr -d '[:space:]' < out/report.txt)"
          echo "----- first lines of the rendered text report -----"
          head -n 20 out/report.txt || true

      # The regression this guards: the gui verb shipped unable to `import webapp`
      # (editable install maps only quiverlab; console scripts don't put the cwd
      # on sys.path) and bound loopback-only, unreachable through -p. Serve, poll,
      # and assert real page content from OUTSIDE the container.
      - name: Smoke -- gui serves through a published port
        run: |
          docker run -d --name gui-smoke -p 8000:8000 \
            "$IMAGE:${{ steps.ver.outputs.version }}" gui --no-open
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -qi quiverlab
          # The draw-a-quiver canvas (docs GUI ported to the webapp) must ship.
          curl -fsS http://127.0.0.1:8000/draw | grep -q 'id="qlgui"'
          curl -fsS http://127.0.0.1:8000/gui/worker.js | grep -q postMessage
          echo "----- gui banner -----"
          docker logs gui-smoke
          docker rm -f gui-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: amd64 (HPC clusters + CI) resolves from the GHA cache built
      # above; arm64 (Apple-Silicon laptops, native -- no qemu warning at run
      # time) builds under qemu here.
      - name: Push multi-arch image (:<version> and :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: QUIVERLAB_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sif-release-asset:
    name: build SIF · attach to release
    needs: build-smoke-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: write        # gh release create/upload
      packages: read         # apptainer pull from GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quiverlab" >> "$GITHUB_ENV"

      - name: Install Apptainer (apt PPA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF from the pushed OCI image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          apptainer build quiverlab.sif "docker://${IMAGE}:${V}"

      - name: Assert SIF < 2 GiB
        run: |
          BYTES=$(stat -c%s quiverlab.sif)
          echo "SIF size: $BYTES bytes"
          test "$BYTES" -lt $((2 * 1024 * 1024 * 1024))

      - name: Attach SIF to the GitHub release (air-gapped fallback asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "quiverlab ${GITHUB_REF_NAME} container release (SIF fallback for air-gapped clusters; the primary path is \`apptainer pull docker://${IMAGE}:${GITHUB_REF_NAME#v}\`)." \
            || true
          gh release upload "${GITHUB_REF_NAME}" quiverlab.sif --clobber
