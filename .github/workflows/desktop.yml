name: Desktop app

# Build the one-file double-clickable QuiverLab desktop app (PyInstaller,
# desktop/quiverlab-desktop.spec) for every OS, package it, then unpack the
# package and smoke THAT copy -- the one a user downloads -- with a REAL exact
# computation AND a full queued report job whose downloaded worked-steps HTML/JSON
# must carry every product Cayley table (cup/cap/bracket/connes_b/cyclic_homology),
# the JSON guide, and the cup/ordered-basis anchors (desktop/smoke.py), so no OS
# binary publishes unless it produces the complete report. Then publish the assets
# on the rolling
# `app-latest` prerelease that the README's "DOWNLOAD APPLICATION HERE" banner
# links to. Packaging per OS:
#   * Windows: raw .exe (double-click works as downloaded)
#   * macOS:   .zip -- browsers drop the executable bit on raw binaries; Archive
#              Utility restores it on extraction. Unsigned: Gatekeeper blocks the
#              first open ("Apple could not verify..."); the user clicks Done,
#              then Privacy & Security -> Open Anyway (right-click->Open no
#              longer bypasses on macOS 15+). Real fix = Developer ID signing +
#              notarization, which needs Marco's Apple Developer credentials.
#   * Linux:   .tar.gz (preserves the executable bit)
# The bundle runs the pure-exact kernels (QUIVERLAB_NO_NUMBA=1; parity with the
# numba path is test-gated) -- see desktop/launcher.py.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-smoke-upload:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write          # gh release create/upload (rolling app-latest)
      id-token: write          # build-provenance attestation (OIDC)
      attestations: write      # build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # No macos-intel target: GitHub retired the macos-13 runners (the last
          # free Intel-mac image), so an x86-64 mac binary cannot be built on
          # hosted runners -- Intel-Mac users take the Docker or pip path
          # (README banner note). Revisit only with a paid *-large Intel runner.
          - os: macos-14
            label: macos-arm64
            asset: QuiverLab-macos-arm64.zip
          - os: windows-latest
            label: windows
            asset: QuiverLab-windows.exe
          - os: ubuntu-22.04    # oldest LTS runner -> widest glibc compat
            label: linux-x86_64
            asset: QuiverLab-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (web + hpc extras, PyInstaller)
        shell: bash
        run: python -m pip install -e ".[hpc,web]" pyinstaller

      - name: Seed the example cache (guarded, best-effort)
        shell: bash
        run: |
          if [ -f container/seed_cache.py ] && [ -f webapp/precomputed/manifest.yaml ]; then
            python container/seed_cache.py --manifest webapp/precomputed/manifest.yaml \
                --out desktop/seed-cache.db || true
          fi

      - name: Build (PyInstaller onefile)
        shell: bash
        run: pyinstaller --noconfirm desktop/quiverlab-desktop.spec

      - name: Package asset
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            windows)      cp dist/QuiverLab.exe "${{ matrix.asset }}" ;;
            linux-*)      tar -C dist -czf "${{ matrix.asset }}" QuiverLab ;;
            macos-*)      (cd dist && zip -X "../${{ matrix.asset }}" QuiverLab) ;;
          esac
          ls -lh "${{ matrix.asset }}"

      # Unpack the asset into a clean directory and smoke THAT copy -- never
      # dist/. The archive is what ships, so the archive is what gets tested:
      # smoking dist/ cannot see a packaging bug (a lost executable bit, a
      # member that never made it in). The extracted binary is deliberately NOT
      # chmod'ed -- if the mode did not survive the round trip, `test -x` fails
      # here rather than in a user's download.
      - name: Unpack the shipped asset
        shell: bash
        run: |
          rm -rf shipped && mkdir shipped
          case "${{ matrix.label }}" in
            windows)   cp "${{ matrix.asset }}" shipped/QuiverLab.exe ;;
            linux-*)   tar -tvzf "${{ matrix.asset }}"
                       tar -C shipped -xzf "${{ matrix.asset }}" ;;
            macos-*)   unzip -Z "${{ matrix.asset }}"
                       unzip -q "${{ matrix.asset }}" -d shipped ;;
          esac
          ls -l shipped
          if [ "${{ matrix.label }}" != "windows" ]; then
            test -x shipped/QuiverLab \
              || { echo "::error::executable bit lost in ${{ matrix.asset }}"; exit 1; }
          fi

      - name: Smoke the shipped asset -- serve + exact compute + complete report
        shell: bash
        run: |
          BIN=shipped/QuiverLab
          [ -f shipped/QuiverLab.exe ] && BIN=shipped/QuiverLab.exe
          python desktop/smoke.py "$BIN"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # Verifiable integrity while the binaries are still unsigned: a per-asset
      # SHA-256 sidecar on the release, plus GitHub build-provenance attestation
      # (verify with: gh attestation verify <file> --owner MarcoArmenta).
      # OS code signing (Apple notarization / Windows Trusted Signing) needs
      # Marco's certificates -- wired here once those exist as repo secrets.
      - name: Checksum sidecar
        shell: bash
        run: |
          python - "${{ matrix.asset }}" <<'EOF'
          import hashlib, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          p.with_name(p.name + ".sha256").write_text(f"{digest}  {p.name}\n")
          print(digest, p.name)
          EOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ matrix.asset }}

      # main only: `app-latest` is what the README's download banner points at,
      # so a branch dispatch builds and smokes but must never overwrite the
      # public binaries. Ship from a branch by merging it first.
      - name: Publish on the rolling app-latest prerelease
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create app-latest \
            --prerelease \
            --title "QuiverLab desktop app (rolling)" \
            --notes "One-file QuiverLab app: download the file for your OS, double-click it, and the local GUI opens in your browser -- fully offline, exact computation, no install. The app is not code-signed yet, so each OS warns once. macOS: unzip, double-click; at the 'Apple could not verify...' dialog click Done (NOT Move to Trash), then System Settings -> Privacy & Security -> Open Anyway -> Open (or in Terminal: xattr -d com.apple.quarantine ./QuiverLab). Windows: if SmartScreen appears, choose More info -> Run anyway. Linux: tar xzf, then ./QuiverLab. Rebuilt from main; not a versioned library release." \
            || true
          gh release upload app-latest "${{ matrix.asset }}" \
            "${{ matrix.asset }}.sha256" --clobber
